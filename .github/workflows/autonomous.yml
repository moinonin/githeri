name: Autonomous Agent CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'sprints/*.spec.yaml'
      - 'docs/features/**/spec.yaml'

env:
  PYTHON_VERSION: '3.11'
  BASE_BRANCH: main

jobs:
  validate-spec:
    name: Validate Spec
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate spec
        run: |
          python scripts/validator.py ${{ github.event.pull_request.head.sha }}

  run-checks:
    name: Run Checks
    runs-on: ubuntu-latest
    needs: validate-spec
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CI checks
        id: checks
        run: |
          python skills/software-development/ci-cd-integration/scripts/run_checks.py \
            --checks lint,typecheck,test,build,security

  merge-on-green:
    name: Merge on Green
    runs-on: ubuntu-latest
    needs: run-checks
    if: github.event_name == 'pull_request' && github.actor == 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auto-merge on green
        run: |
          python skills/software-development/ci-cd-integration/scripts/merge_on_green.py \
            ${{ github.event.pull_request.number }} \
            --method squash \
            --timeout 600 \
            --rollback-on-failure \
            --auto-approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: run-checks
    if: github.event_name == 'pull_request' && failure()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rollback failed PR
        run: |
          python skills/software-development/ci-cd-integration/scripts/merge_on_green.py \
            ${{ github.event.pull_request.number }} \
            --rollback-on-failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [merge-on-green, rollback-on-failure]
    if: always()
    steps:
      - name: Send notification
        run: |
          STATUS="${{ needs.merge-on-green.result }}"
          PR="${{ github.event.pull_request.number }}"
          echo "PR #${PR} ${STATUS}"
          # Add Slack/Discord/Email notification here