[project]
name = "add_notifications_endpoint"
version = "0.1.0"
description = "Add POST /notifications endpoint for sending email and push notifications"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]