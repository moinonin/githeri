task_id: sprint11-sprint-orchestrator
summary: "Build sprint orchestrator for parallel feature execution with dependency resolution"
depends_on: ["sprint10-observability-dashboard"]
local_goals:
  - id: L1
    description: "CREATE: Sprint orchestrator with dependency graph and topological sort"
    verification:
      type: file_exists
      path: skills/software-development/sprint-orchestrator/scripts/orchestrator.py
      expect:
        content_contains: "SprintOrchestrator"
  - id: L2
    description: "CREATE: Dependency graph with cycle detection and parallel group detection"
    verification:
      type: file_exists
      path: skills/software-development/sprint-orchestrator/scripts/dependency_graph.py
      expect:
        content_contains: "DependencyGraph|topological_sort"
  - id: L3
    description: "CREATE: Worker pool with resource management (GPU, memory, workers)"
    verification:
      type: file_exists
      path: skills/software-development/sprint-orchestrator/scripts/worker_pool.py
      expect:
        content_contains: "WorkerConfig|ResourceTracker"
  - id: L4
    description: "CREATE: SPRINTS.md with dependency syntax and parallel groups"
    verification:
      type: file_exists
      path: docs/SPRINTS.md
      expect:
        content_contains: "depends_on|parallel_group"
  - id: L5
    description: "VERIFY: Orchestrator runs 3 sprints in parallel with correct deps"
    verification:
      type: cli
      command: "make -f Makefile.sprints orchestrate SPRINTS=test_sprints.md --dry-run"
      expect:
        exit_code: 0
        stdout_contains: "parallel"
  - id: L6
    description: "VERIFY: Full orchestration with failure handling and retry logic"
    verification:
      type: cli
      command: "make -f Makefile.sprints orchestrate SPRINTS=test_sprints.md --workers 2"
      expect:
        exit_code: 0
        stdout_contains: "completed"
context:
  language: Python
  framework: Hermes
  test_framework: pytest